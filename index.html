<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurelia EventOS · Gestión de Eventos Corporativos de Alto Perfil</title>
<meta name="description" content="Aurelia EventOS — Suite de gestión integral de eventos corporativos de alto perfil. Proyecto académico, Actividad 4." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Georgia'>A</text></svg>" />
</head>
<body>
  <div id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <strong>Aurelia</strong>
          <span>EventOS</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="demo-chip">
          <span class="dot"></span> Modo demostración
        </div>
        <button class="ghost-btn" id="reset-demo" title="Restaurar datos de demostración">Restaurar datos</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-toggle" aria-label="Menú">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-right">
          <div class="searchbox">
            <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="global-search" type="search" placeholder="Buscar evento, asistente o tarea…" autocomplete="off" />
            <div class="search-results" id="search-results"></div>
          </div>
          <button class="icon-btn notif-btn" id="notif-btn" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M10 19a2 2 0 004 0" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
            <span class="badge-count" id="notif-count">0</span>
          </button>
          <div class="userbox">
            <div class="avatar" id="user-avatar">CC</div>
            <div class="user-meta">
              <strong>Celso I. Castro</strong>
              <span>Director de Protocolo</span>
            </div>
          </div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div class="notif-panel" id="notif-panel" hidden></div>
  <div class="toast-stack" id="toasts"></div>
  <div class="modal-root" id="modal-root" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
